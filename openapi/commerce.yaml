openapi: 3.1.0
info:
  title: Internal Commerce API
  version: 0.1.0-provisional
  description: |
    PROVISIONAL. Drafted by the frontend so storefront work can proceed against
    MSW mocks before the real API exists. This is the contract the storefront
    expects; it is a proposal to the backend team, not a description of a
    shipped service. Replace wholesale once the real spec lands.

    Three requirements are load-bearing and are the reason this file exists
    (see docs/architecture.md §9):

    1. Every mutating operation accepts an `Idempotency-Key` header. Server
       Actions retry and users double-click; without this, duplicate orders are
       unavoidable and cannot be fixed on the frontend.
    2. Errors carry a stable machine-readable `code`. The UI must distinguish
       out-of-stock from a server fault without string-matching prose.
    3. Money is an integer in minor units plus an explicit currency. No floats.

    Not modelled here: the catalog-publish webhook the backend must call so the
    storefront can `revalidateTag`. It is an inbound call to the storefront, not
    an endpoint on this API, but it is a hard dependency for catalog caching.

servers:
  - url: https://commerce.internal/v1
    description: Private network only. Never internet-facing (ADR-0001).

tags:
  - name: catalog
  - name: cart
  - name: checkout

paths:
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      description: |
        Faceted catalog listing. Filters are AND-combined across keys and
        OR-combined within a key, which is the behaviour a facet panel implies:
        ticking two brands widens, ticking a brand and a kind narrows.

        `brand` + `model` together are how a shopper finds the consumable that
        fits their printer — the single most important query this shop serves.
        They filter on the `compatibility` of the product, not on its own
        manufacturer; see `Compatibility`.
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - name: brand
          in: query
          description: Printer manufacturer the consumable must be compatible with.
          schema: { type: string }
        - name: model
          in: query
          description: |
            Printer model the consumable must be compatible with. Only meaningful
            alongside `brand`: model designations are not unique across brands.
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ProductKind" }
        - name: manufacturer
          in: query
          description: Who made the consumable (G&G, INTEGRAL, CET…), not the printer brand.
          schema: { type: string }
        - name: color
          in: query
          schema: { $ref: "#/components/schemas/ProductColor" }
        - name: inStock
          in: query
          description: When true, exclude products with no available stock.
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, yield_desc]
            default: relevance
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        default: { $ref: "#/components/responses/Error" }

  /compat/brands:
    get:
      operationId: listPrinterBrands
      tags: [catalog]
      description: |
        Printer manufacturers this catalog carries consumables for. Small and
        near-static, so the storefront caches it hard and renders the finder
        without a round trip.
      responses:
        "200":
          description: Printer brands.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PrinterBrand" }
        default: { $ref: "#/components/responses/Error" }

  /compat/brands/{brand}/models:
    get:
      operationId: listPrinterModels
      tags: [catalog]
      description: |
        Printer models for one brand, for the second step of the finder.
        Separate from `/compat/brands` so the payload stays small: shipping every
        model of every brand up front would be a large download to support one
        dropdown.
      parameters:
        - { name: brand, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Printer models.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PrinterModel" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      description: |
        Static product content only. Cacheable with a long TTL. Deliberately
        excludes price and availability so the PDP can cache this shell and
        stream the volatile parts separately.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /products/{slug}/offer:
    get:
      operationId: getOffer
      tags: [catalog]
      description: |
        Price and availability. Volatile: short TTL or uncached. Split from
        product content so a cached PDP shell can never serve a stale price.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /offers:
    get:
      operationId: listOffers
      tags: [catalog]
      description: |
        Live prices and availability for several products at once.

        Exists so a listing page can show prices without giving up its cache.
        The product grid is cached for hours; offers must never be. Fetching
        them per card would mean one uncached round trip per product, so the
        storefront issues exactly one batched call per listing page and streams
        the result into the already-rendered grid behind `<Suspense>`.

        Unknown slugs are omitted rather than erroring: a product deleted
        between the cached listing and this call is an ordinary race, and it
        must not blank the prices of every other product on the page.
      parameters:
        - name: slugs
          in: query
          required: true
          description: Comma-separated product slugs. Capped to protect the backend.
          schema: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Offers for the slugs that resolved.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OfferListItem" }
        default: { $ref: "#/components/responses/Error" }

  /carts:
    post:
      operationId: createCart
      tags: [cart]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Cart created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        default: { $ref: "#/components/responses/Error" }

  /carts/{cartId}:
    get:
      operationId: getCart
      tags: [cart]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /carts/{cartId}/lines:
    post:
      operationId: addCartLine
      tags: [cart]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "409":
          description: Stock or price conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /carts/{cartId}/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [cart]
      description: |
        Sets an absolute quantity, never a delta. The client debounces and
        coalesces rapid changes, so a delta API would produce racing writes.
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "409":
          description: Stock or price conflict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeCartLine
      tags: [cart]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: lineId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Updated cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        default: { $ref: "#/components/responses/Error" }

  /carts/{cartId}/merge:
    post:
      operationId: mergeCart
      tags: [cart]
      description: |
        Merges the guest cart into the authenticated user's cart on login.
        Backend-owned so every client behaves identically: sum quantities per
        variant, re-validate stock, clamp to available.
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Merged cart.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        default: { $ref: "#/components/responses/Error" }

  /checkout/sessions:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      description: |
        Creates the payment intent and returns the PSP redirect URL. The
        idempotency key is derived from cart id + cart version, so a
        double-clicked Pay button cannot create two orders.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartId, cartVersion]
              properties:
                cartId: { type: string }
                cartVersion: { type: integer }
                email: { type: string, format: email }
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "409":
          description: Cart changed since the version supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /orders/{orderRef}:
    get:
      operationId: getOrder
      tags: [checkout]
      description: |
        Authoritative order state. The storefront calls this on return from the
        PSP; return-URL query parameters are attacker-controlled and are never
        trusted.
      parameters:
        - { name: orderRef, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Deterministic per logical intent, not random per call. Replaying a key
        with an identical payload returns the original result; replaying with a
        different payload is a 422. Retention: at least 24h.
      schema: { type: string, minLength: 8, maxLength: 255 }

  responses:
    Error:
      description: Structured error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: object
      required: [amountMinor, currency]
      description: |
        Integer minor units (e.g. 1099 == EUR 10.99) plus an ISO 4217 code.
        Never a float: binary floating point cannot represent decimal currency
        exactly, and the rounding error lands on a customer's invoice.
      properties:
        amountMinor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }

    Image:
      type: object
      required: [url, alt, width, height]
      description: Dimensions are required so the UI can reserve space and avoid CLS.
      properties:
        url: { type: string, format: uri }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }

    ProductKind:
      type: string
      enum: [toner, inkjet, drum, fuser, waste, roller, other]
      description: |
        What the consumable physically is. Drives category navigation and is a
        facet. `other` exists so an unrecognised backend value degrades to a
        listable product rather than breaking the catalog.

    ProductColor:
      type: string
      enum: [black, cyan, magenta, yellow, tricolor, none]
      description: |
        `none` for items that have no colour at all (fuser units, rollers, waste
        containers) — distinct from an unknown or absent colour.

    PrinterBrand:
      type: object
      required: [slug, name]
      description: A printer manufacturer, e.g. Brother, HP, Kyocera.
      properties:
        slug:
          { type: string, description: URL-safe identifier, e.g. `brother`. }
        name: { type: string }
        productCount: { type: integer, minimum: 0 }

    PrinterModel:
      type: object
      required: [slug, name]
      description: A printer model within a brand, e.g. HL-2130.
      properties:
        slug: { type: string }
        name: { type: string }
        productCount: { type: integer, minimum: 0 }

    Compatibility:
      type: object
      required: [printerBrand, printerModels]
      description: |
        One printer brand and the models of it this consumable fits. A product
        carries several of these, because a single cartridge typically fits
        dozens of models and occasionally more than one brand.

        This is the field that makes the shop usable: it is what `brand`/`model`
        on `/products` filter against, and what the PDP prints so a buyer can
        confirm the part fits before ordering.
      properties:
        printerBrand: { $ref: "#/components/schemas/PrinterBrand" }
        printerModels:
          type: array
          items: { $ref: "#/components/schemas/PrinterModel" }

    ProductAttributes:
      type: object
      description: |
        Consumable specifications. Every field is optional because the catalog
        mixes categories: a fuser unit has no page yield or colour, and a
        third-party cartridge may have no OEM code at all.
      properties:
        color: { $ref: "#/components/schemas/ProductColor" }
        yieldPages:
          type: integer
          minimum: 0
          description: |
            Rated page yield at the industry standard coverage (ISO/IEC 19752 for
            mono toner, 24711 for inkjet). The headline number on every listing —
            price per page is how these products are actually compared.
        oemCodes:
          type: array
          description: |
            Original manufacturer part codes this item replaces, e.g.
            ["CB435A", "35A"]. Buyers search by these, so they are matched
            against and displayed verbatim — never normalised or prettified.
          items: { type: string }
        manufacturer:
          type: string
          description: Who made this consumable (G&G, INTEGRAL, CET, HYB…).
        isOriginal:
          type: boolean
          description: |
            True for genuine OEM stock, false for a compatible equivalent.
            Supplied explicitly by the backend and never inferred from the title:
            selling a compatible cartridge as original is a consumer-protection
            problem, not a display detail.

    Product:
      type: object
      required: [id, slug, title, images, variants]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/ProductKind" }
        attributes: { $ref: "#/components/schemas/ProductAttributes" }
        compatibility:
          type: array
          items: { $ref: "#/components/schemas/Compatibility" }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }

    Variant:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }

    FacetValue:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
          description: The value to send back as a query parameter.
        label:
          type: string
          description: |
            Display text, supplied by the backend rather than derived from
            `value`. The storefront must not map codes to Romanian prose itself:
            that mapping would silently go stale as the catalog grows.
        count: { type: integer, minimum: 0 }

    Facet:
      type: object
      required: [key, label, values]
      properties:
        key:
          type: string
          description: The `/products` query parameter this facet drives.
          enum: [brand, model, kind, manufacturer, color]
        label: { type: string }
        values:
          type: array
          items: { $ref: "#/components/schemas/FacetValue" }

    ProductPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        nextCursor:
          type: [string, "null"]
          description: Cursor pagination; offsets duplicate rows under concurrent writes.
        total:
          type: integer
          minimum: 0
          description: Total matches for the filter, not the size of this page.
        facets:
          type: array
          description: |
            Available refinements for the current filter, with counts computed
            against it. Counts are catalog data and must never depend on the
            session, or a per-visitor number would land in a shared cache.
          items: { $ref: "#/components/schemas/Facet" }

    Availability:
      type: object
      required: [inStock, quantity]
      properties:
        inStock: { type: boolean }
        quantity: { type: integer, minimum: 0 }

    PriceTier:
      type: object
      required: [minQuantity, unitPrice]
      description: |
        One quantity break. `unitPrice` is the VAT-inclusive price each unit costs
        once `minQuantity` is reached — already computed by the backend, never a
        percentage the storefront applies.
      properties:
        minQuantity: { type: integer, minimum: 2 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        unitPriceExVat: { $ref: "#/components/schemas/Money" }

    Offer:
      type: object
      required: [variantId, price, priceExVat, vatRate, availability]
      description: |
        Price and availability for one variant.

        **Both VAT figures are supplied by the backend.** The storefront never
        derives one from the other, even though the rate is right there. Applying
        a rate means multiplying money by a fraction, which requires a rounding
        policy — and `src/lib/money.ts` refuses fractional multipliers precisely
        so that policy cannot be invented at the render edge. In Romania the
        ex-VAT figure is what B2B buyers compare and what appears on the invoice,
        so a storefront-side rounding error is a billing discrepancy, not a
        cosmetic one.
      properties:
        variantId: { type: string }
        price:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: VAT-inclusive unit price. The headline figure.
        priceExVat:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: VAT-exclusive unit price, for business buyers.
        vatRate:
          type: integer
          minimum: 0
          description: |
            VAT rate in basis points (1900 = 19%). Integer, so the rate itself is
            exact. Present for display and invoicing, NOT so the client can
            compute the other price.
        compareAtPrice: { $ref: "#/components/schemas/Money" }
        priceTiers:
          type: array
          description: |
            Quantity breaks, ascending by `minQuantity`. Display-only in the
            storefront: what a customer is charged comes from the cart response,
            never from re-applying a tier client-side.
          items: { $ref: "#/components/schemas/PriceTier" }
        availability: { $ref: "#/components/schemas/Availability" }

    OfferListItem:
      type: object
      required: [slug, offer]
      description: |
        An offer tagged with the slug it belongs to. The pairing is explicit
        rather than positional, because the response omits slugs that did not
        resolve and an index-based mapping would then silently attach prices to
        the wrong products.
      properties:
        slug: { type: string }
        offer: { $ref: "#/components/schemas/Offer" }

    CartLine:
      type: object
      required: [id, variantId, title, quantity, unitPrice, lineTotal]
      properties:
        id: { type: string }
        variantId: { type: string }
        title: { type: string }
        image: { $ref: "#/components/schemas/Image" }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }

    CartTotals:
      type: object
      required: [subtotal, total]
      properties:
        subtotal: { $ref: "#/components/schemas/Money" }
        shipping: { $ref: "#/components/schemas/Money" }
        tax: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    Cart:
      type: object
      required: [id, version, lines, totals]
      properties:
        id: { type: string }
        version:
          type: integer
          description: Increments on every mutation. Used for checkout idempotency.
        lines:
          type: array
          items: { $ref: "#/components/schemas/CartLine" }
        totals: { $ref: "#/components/schemas/CartTotals" }

    CheckoutSession:
      type: object
      required: [orderRef, redirectUrl]
      properties:
        orderRef: { type: string }
        redirectUrl: { type: string, format: uri }

    Order:
      type: object
      required: [id, status, total]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending, paid, failed, cancelled]
          description: |
            `pending` is a real state, not an error: the PSP webhook may not have
            landed when the customer returns. The storefront polls rather than
            guessing an outcome.
        total: { $ref: "#/components/schemas/Money" }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - not_found
            - out_of_stock
            - price_changed
            - cart_expired
            - unauthorized
            - validation_failed
            - unavailable
          description: |
            Stable and machine-readable. `message` is for logs and developers;
            never branch on it, and never show it to customers.
        message: { type: string }
        details:
          type: object
          description: |
            Code-specific, machine-readable payload. Because `message` must never
            be shown to a customer, anything the UI needs to react to belongs
            here.

            - `out_of_stock`: `variantId`, `available`
            - `price_changed`: `oldPrice`, `newPrice`
            - `validation_failed`: `field` (the field path that failed, so the
              storefront can mark the right input using its own copy)
          additionalProperties: true
